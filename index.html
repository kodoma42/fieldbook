<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fieldbook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b6bcb">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Work Companion Fieldbook</title>
<style>
:root{
  --bg:#f2f3f5; --card:#ffffff; --text:#14181f; --muted:#6b7280; --line:#e2e5ea;
  --accent:#0b6bcb; --accent-ink:#ffffff; --danger:#d92d20; --ok:#1a7f4b;
  --chip:#eef2f7; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216; --card:#1a1f26; --text:#e8ebef; --muted:#9aa4b2; --line:#2a313a;
    --accent:#5aa6ff; --accent-ink:#06121f; --danger:#ff6b60; --ok:#4cc38a;
    --chip:#242b34; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Header */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg);
  border-bottom:1px solid var(--line)}
.bar h1{flex:1;margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:42px;height:42px;
  padding:0 10px;border:0;border-radius:12px;background:transparent;color:var(--accent);cursor:pointer}
.ibtn:active{background:var(--chip)}
.ico{display:inline-flex;width:22px;height:22px}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:640px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 110px)}
.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  max-width:420px;margin:0 auto;padding:24px 20px calc(env(safe-area-inset-bottom) + 24px)}
.logo{width:64px;height:64px;border-radius:16px;margin:0 0 16px;box-shadow:var(--shadow)}
.center h1{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
.brand{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.01em}
.version{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}

/* Forms */
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;margin:0 0 4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  font-size:16px;appearance:none;-webkit-appearance:none;min-height:46px}
input[type=date]{min-height:46px}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.dur{display:flex;gap:8px;align-items:center}
.dur input{text-align:center}
.dur em{font-style:normal;color:var(--muted);font-size:14px}
.meas{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}
.meas label.f{margin:0}
.meas .unit{color:var(--muted);font-weight:500}

/* Buttons */
.btn{display:block;width:100%;padding:13px 16px;border:0;border-radius:14px;background:var(--accent);
  color:var(--accent-ink);font-weight:650;font-size:16px;cursor:pointer;text-align:center}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.55}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.link{background:transparent;color:var(--accent);padding:10px}
.stack>*+*{margin-top:10px}
.err{color:var(--danger);min-height:20px;margin:8px 0 0;font-size:14px}
.ok{color:var(--ok)}

/* Cards / list */
.search{margin-bottom:10px}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px;color:var(--muted);font-size:13px}
.day{margin:16px 2px 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{display:block;width:100%;text-align:left;margin:0 0 8px;padding:13px 14px;border:1px solid var(--line);
  border-radius:16px;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
.card:active{filter:brightness(.96)}
.card-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card-top strong{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{flex:none;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--chip)}
.chip b{font-weight:650}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.sect{margin:0 0 18px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.sect h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.setrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0}
.fieldrow{display:grid;grid-template-columns:1fr 84px;gap:8px;margin-bottom:8px}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 16px);
  display:inline-flex;align-items:center;gap:8px;padding:0 20px 0 16px;height:54px;border:0;border-radius:27px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;
  box-shadow:0 6px 18px rgba(11,107,203,.35);cursor:pointer}
.fab:active{filter:brightness(.92)}

.footer-actions{position:sticky;bottom:0;margin:18px -14px 0;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* Modal + toast */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:600px){.overlay{align-items:center}}
.modal{width:100%;max-width:440px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
@media (min-width:600px){.modal{border-radius:20px}}
.modal h3{margin:0 0 6px;font-size:18px}
.modal p{margin:0 0 12px;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:30;
  max-width:90vw;padding:10px 16px;border-radius:12px;background:var(--text);color:var(--bg);font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.banner{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--accent);box-shadow:var(--shadow)}
.hint{margin-top:16px;padding:12px;border-radius:12px;background:var(--chip);font-size:13px;color:var(--muted)}
a.btn{text-decoration:none}
.linkrow{display:flex;justify-content:space-between;gap:6px;margin-top:6px}
.linkrow .btn{width:auto;flex:1;font-size:14.5px;padding:10px 4px;white-space:nowrap}
.setrow.wide{align-items:flex-start;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.setrow.wide:first-of-type{border-top:0}
.setrow.wide .btns{display:flex;gap:8px;flex-wrap:wrap}
.code-in{text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
.sheet-brand{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:10px}
.code-big{font:700 21px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;text-align:center;
  padding:16px 8px;margin:0 0 6px;border:2px dashed var(--line);border-radius:14px;word-break:keep-all;user-select:all}
.sheet-date{margin:0 0 12px;font-size:12px;text-align:center}
.modal{max-height:92dvh;overflow:auto}
/* Reiterleiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border:0;background:none;
  color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;min-width:0}
.tab span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab[aria-current=page]{color:var(--accent)}
.tab:active{background:var(--chip)}
.fab{bottom:calc(env(safe-area-inset-bottom) + 70px)}
.wrap{padding-bottom:calc(env(safe-area-inset-bottom) + 150px)}
.toast{bottom:calc(env(safe-area-inset-bottom) + 130px)}

/* Datumsfilter */
.datefilter{display:flex;gap:10px;margin:0 0 8px}
.datefilter label{flex:1;min-width:0}
.datefilter label span{display:block;margin:0 0 3px;font-size:12px;font-weight:600;color:var(--muted)}
.datefilter input{min-height:42px;padding:8px 10px;font-size:15px}
.qchips{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 8px;padding:0 14px 2px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchip{flex:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13.5px;cursor:pointer}
.qchip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.rangetag{padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--text);font-weight:600}
.chip.warn,.dayhint.warn{background:color-mix(in srgb,var(--danger) 16%,var(--card));color:var(--danger);font-weight:650}
.dayhint{margin-top:2px;font-size:13px;color:var(--muted)}
.dayhint.warn{padding:8px 10px;border-radius:10px}
.dayhint:empty{display:none}

/* Kunden */
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv span{color:var(--muted);font-size:14px}
.spark{color:var(--accent);margin:10px 0 4px}
.spark svg{display:block;width:100%;height:auto;background:var(--chip);border-radius:12px}
.hist{margin-top:8px}
.histrow{display:flex;justify-content:space-between;padding:6px 2px;border-top:1px solid var(--line);font-size:14px}
.histrow:first-child{border-top:0}

/* Kalender */
.calnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}
.calmonth{font-size:18px;font-weight:700}
.calstat{margin:0 2px 10px;display:grid;gap:2px}
.spesenbox{font-size:15px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calwd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:2px 0}
.calday{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;padding:3px 0;
  border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;min-width:0}
.calday .dn{font-size:15px;font-weight:600}
.calday .dt{font-size:10.5px;color:var(--muted)}
.calday.has{border-color:var(--accent)}
.calday.sp{background:color-mix(in srgb,var(--danger) 18%,var(--card));border-color:var(--danger)}
.calday.sp .dt{color:var(--danger);font-weight:700}
.calday.today .dn{text-decoration:underline;text-underline-offset:3px}
.calday.sel{outline:2px solid var(--accent);outline-offset:1px}
.daysum{display:flex;gap:8px;align-items:center;margin:0 2px 8px;font-size:14px;color:var(--muted)}
.calday:active{filter:brightness(.95)}

/* Art des Einsatzes, Fahrzeit, Schalter */
.chip.kind{background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--accent);font-weight:650}
.sumbox span{display:block;margin:0 0 4px;font-size:13px;font-weight:600;color:var(--muted)}
.sumval{min-height:46px;display:flex;align-items:center;padding:0 4px;font-size:17px;font-weight:650}
.switchrow{cursor:pointer}
input.switch{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;
  margin:0;cursor:pointer;transition:background .15s}
input.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
input.switch:checked{background:var(--accent)}
input.switch:checked::after{transform:translateX(20px)}
@media print{
  :root{--bg:#fff;--card:#fff;--text:#000;--muted:#333;--line:#999;--accent:#000}
  #app,.toast,.noprint,.tabs,.fab{display:none!important}
  .overlay{position:static;display:block;background:#fff}
  .modal{max-width:none;border-radius:0;padding:24px;box-shadow:none;max-height:none;overflow:visible}
  .code-big{font-size:28px}
}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">Diese App benötigt JavaScript.</p></noscript>
<script src="crypto.js"></script>
<script src="app.js"></script>
</body>
</html>
